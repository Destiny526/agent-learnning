# ============================================================
# AI 智能出行助手 - Docker Compose 配置
# 一键启动: docker compose up -d
#
# 使用前请先复制 .env.example 为 .env 并修改密码:
#   cp .env.example .env
# ============================================================

services:
  # ── MySQL 数据库 ──
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-travel_assistant}
      MYSQL_USER: ${MYSQL_USER:-travel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - travel-network

  # ── Redis 缓存 ──
  redis:
    image: redis:7-alpine
    container_name: travel-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      timeout: 10s
      retries: 5
      interval: 10s
    networks:
      - travel-network

  # ── Qdrant 向量数据库 ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: travel-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - travel-network

  # ── User Service ──
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: travel-user-service
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: "mysql://${MYSQL_USER:-travel_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-travel_assistant}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travel-network

  # ── Ticket Service ──
  ticket-service:
    build:
      context: ./services/ticket-service
      dockerfile: Dockerfile
    container_name: travel-ticket-service
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - travel-network

  # ── AI Service ──
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: travel-ai-service
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # LLM Configuration
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT: "60"
      LLM_MAX_RETRIES: "3"
      LLM_FALLBACK_ENABLED: "true"
      # Qdrant Configuration
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - travel-network

  # ── Order Service ──
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: travel-order-service
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: HS256
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: "mysql://${MYSQL_USER:-travel_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-travel_assistant}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travel-network

  # ── Notification Service ──
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: travel-notification-service
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: HS256
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: "mysql://${MYSQL_USER:-travel_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-travel_assistant}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travel-network

  # ── API Gateway ──
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: travel-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: HS256
      USER_SERVICE_URL: http://user-service:8001
      TICKET_SERVICE_URL: http://ticket-service:8002
      AI_SERVICE_URL: http://ai-service:8003
      ORDER_SERVICE_URL: http://order-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
    depends_on:
      - user-service
      - ticket-service
      - ai-service
      - order-service
      - notification-service
    networks:
      - travel-network

  # ── Next.js 前端 ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Gateway 地址（服务端调用）
      GATEWAY_URL: http://gateway:8000
      # Gateway 地址（客户端调用）
      NEXT_PUBLIC_API_URL: http://gateway:8000
      # JWT 配置（用于 cookie 签发）
      JWT_SECRET: ${JWT_SECRET_KEY}
      # 应用配置
      NEXT_PUBLIC_USE_MOCK: "false"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - travel-network

# ── 数据卷 ──
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local

# ── 网络 ──
networks:
  travel-network:
    driver: bridge
